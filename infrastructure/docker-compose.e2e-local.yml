# Override for E2E with local Sui validator (testnet-helpers).
# Use: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.e2e-local.yml up

version: '3.8'

services:
  sui-service:
    environment:
      - SUI_NETWORK=local
      - SUI_RPC_URL=http://host.docker.internal:9000
      - SUI_FAUCET_URL=http://host.docker.internal:9123/gas
    extra_hosts:
      - "host.docker.internal:host-gateway"

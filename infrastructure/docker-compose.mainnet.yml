# Docker Compose override for Sui Mainnet
# Usage: docker-compose -f docker-compose.yml -f docker-compose.mainnet.yml up
# WARNING: Mainnet uses real SUI tokens - use with caution!

version: '3.8'

services:
  sui-service:
    environment:
      - SUI_NETWORK=mainnet
      - SUI_RPC_URL=https://fullnode.mainnet.sui.io:443
      # No faucet for mainnet

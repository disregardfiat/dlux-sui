version: '3.8'

networks:
  dlux-network:
    driver: bridge
    name: dlux-network

services:
  # dGraph database
  dgraph-zero:
    image: dgraph/dgraph:latest
    volumes:
      - dgraph_zero:/dgraph
    ports:
      - "5080:5080"
      - "8000:8000"
    restart: unless-stopped
    command: dgraph zero --my=dgraph-zero:5080
    networks:
      - dlux-network

  dgraph-alpha:
    image: dgraph/dgraph:latest
    volumes:
      - dgraph_alpha:/dgraph
      - ./backups:/backups  # For backup/restore operations
      - ./exports:/exports  # For data export operations
    ports:
      - "8080:8080"
      - "9080:9080"
    restart: unless-stopped
    command: dgraph alpha --my=dgraph-alpha:7080 --zero=dgraph-zero:5080 --lru_mb=512
    environment:
      - DGRAPH_ALPHA_BACKUP_PATH=/backups  # Default backup location
      - DGRAPH_ALPHA_EXPORT_PATH=/exports  # Default export location
    depends_on:
      - dgraph-zero
    networks:
      - dlux-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # SUI Service
  sui-service:
    build:
      context: ../services/sui-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - SUI_NETWORK=${SUI_NETWORK:-testnet}  # testnet, devnet, mainnet
      - SUI_RPC_URL=${SUI_RPC_URL:-}  # Auto-set based on SUI_NETWORK if not provided
      - SUI_FAUCET_URL=${SUI_FAUCET_URL:-}  # For testnet/devnet
      - LOG_LEVEL=info
      - JWT_SECRET=development-jwt-secret-key-change-in-production
      - POLL_INTERVAL=30000
      - DGRAPH_SERVICE_URL=http://dgraph-service:3003
    restart: unless-stopped
    volumes:
      - ../services/sui-service/logs:/app/logs
    networks:
      - dlux-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Walrus Service
  walrus-service:
    build:
      context: ../services/walrus-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - LOG_LEVEL=info
      - WALRUS_BASE_URL=https://walrus-testnet.mrgnlabs.xyz
      - MAX_FILE_SIZE=52428800
      - ZK_SERVICE_URL=http://zk-service:3010
      - DGRAPH_SERVICE_URL=http://dgraph-service:3003
      - SUI_SERVICE_URL=http://sui-service:3001
    restart: unless-stopped
    volumes:
      - ../services/walrus-service/logs:/app/logs
    networks:
      - dlux-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # dGraph Service
  dgraph-service:
    build:
      context: ../services/dgraph-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - LOG_LEVEL=info
      - DGRAPH_HOST=dgraph-alpha:9080
      - DGRAPH_USER=groot
      - DGRAPH_PASSWORD=password
      - GRAPHQL_INTROSPECTION=true
      - GRAPHQL_PLAYGROUND=true
      - BLOCKCHAIN_INDEXER_ENABLED=false
      - BLOCKCHAIN_INDEXER_POLL_INTERVAL=300000
      - ZK_SERVICE_URL=http://zk-service:3010
    restart: unless-stopped
    depends_on:
      dgraph-alpha:
        condition: service_healthy
    volumes:
      - ../services/dgraph-service/logs:/app/logs
    networks:
      - dlux-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Presence Service
  presence-service:
    build:
      context: ../services/presence-service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - LOG_LEVEL=info
      - HOCUSPOCUS_PORT=3005
      - TURN_HOST=localhost
      - TURN_PORT=3478
      - STUN_HOST=localhost
      - STUN_PORT=3478
      - WEBRTC_TIMEOUT=30000
      - MAX_PARTICIPANTS_PER_SESSION=50
    restart: unless-stopped
    volumes:
      - ../services/presence-service/logs:/app/logs

  # ZK Service
  zk-service:
    build:
      context: ../services/zk-service
      dockerfile: Dockerfile
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=development
      - PORT=3010
      - LOG_LEVEL=info
      - DGRAPH_SERVICE_URL=http://dgraph-service:3003
      # CIRCUIT_* paths and HOMOMORPHIC_* keys are optional for basic dev
    restart: unless-stopped
    depends_on:
      - dgraph-service

  # MCP Service (AI assistant integration)
  mcp-service:
    build:
      context: ../services/mcp-service
      dockerfile: Dockerfile
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=development
      - PORT=3009
      - LOG_LEVEL=info
      - SUI_SERVICE_URL=http://sui-service:3001
      - DGRAPH_SERVICE_URL=http://dgraph-service:3003
      - WALRUS_SERVICE_URL=http://walrus-service:3002
    restart: unless-stopped
    depends_on:
      - sui-service
      - dgraph-service
      - walrus-service

  # Webhook Service (primarily for the server; included for completeness)
  webhook-service:
    build:
      context: ../services/webhook-service
      dockerfile: Dockerfile
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=development
      - PORT=3011
      - LOG_LEVEL=info
      - DEPLOY_BRANCH=main
      # GITHUB_WEBHOOK_SECRET should be set in a local override if you enable this
      - GITHUB_WEBHOOK_SECRET=
      - REPO_PATH=/repo
      - DEPLOY_SCRIPT_PATH=/repo/deploy-server.sh
    restart: unless-stopped

  # Sandbox Service (placeholder - would need custom reverse proxy)
  # sandbox-service:
  #   build:
  #     context: ../frontend/sandbox
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3006:3006"
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=3006
  #   depends_on:
  #     - walrus-service
  #     - sui-service

  # Vue Frontend
  vue-app:
    build:
      context: ../frontend/vue-app
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=development
      - VITE_GRAPHQL_URL=http://localhost:3003/graphql
    restart: unless-stopped

volumes:
  dgraph_zero:
  dgraph_alpha: